name: Verificar APK publicado
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'android-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download signed release
        run: curl --fail --location --output RUBRA.apk https://github.com/AllanDanil0/ProjetoDungeon/releases/download/android-1.14.0/RUBRA.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch public APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/android-download-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-apk-check
          path: test-output/android-public
