name: Publicar jogo para Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar JavaScript
        run: npm run check
      - name: Testar logica e interface
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:menus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:profane
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:sanctuary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ice-polish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:boot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar executavel
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verificar janela e F11 no aplicativo empacotado
        run: npx electron tests/window.cjs --packaged
      - name: Verificar isolamento do build
        run: npm run verify:package
      - name: Testar executavel real e reabertura de campanha
        run: npm run test:portable
      - name: Publicar nova versao
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: windows-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/RUBRA-Windows-x64.exe'
          if (!(Test-Path $exe)) { throw 'Executavel nao encontrado' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  RUBRA-Windows-x64.exe" | Set-Content dist/SHA256.txt
          gh release create $env:RELEASE_TAG $exe dist/SHA256.txt --target $env:COMMIT_SHA --title "The night is yours - Windows $env:RELEASE_TAG" --notes "Baixe RUBRA-Windows-x64.exe e abra com dois cliques. Windows 10/11 x64; funciona offline, sem instalacao. Executavel sem assinatura digital." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
