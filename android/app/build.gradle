plugins { id 'com.android.application' }
android {
 namespace 'local.rubra.game'
 compileSdk 35
 buildFeatures { buildConfig true }
 defaultConfig { applicationId 'local.rubra.game'; minSdk 26; targetSdk 35; versionCode 11400; versionName '1.14.0'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 buildTypes { release { minifyEnabled false }; debug { applicationIdSuffix '.test' } }
 sourceSets { main { assets.srcDirs = ['build/generated/gameAssets'] } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.register('copyGame', Copy) {
 from('../..') { include 'index.html', 'src/**', 'assets/**' }
 into 'build/generated/gameAssets'
}
preBuild.dependsOn copyGame
